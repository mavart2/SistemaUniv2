<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Nuevo Alumno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<style>
    .container {
        max-width: 400px;
    }
    .logo-container {
        background-color: blue;
        padding: 10px;
    }
    .logo {
        height: 50px;
    }
</style>
<body>
<div>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Universidad Andes</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link " aria-current="page" href="lista">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="#">Agregar</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link disabled" aria-disabled="true">Disabled</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</div>
<div class="logo-container text-center">
    <img src="https://images.squarespace-cdn.com/content/v1/52feaa1ae4b09bbb5407864d/322ea8e0-b7e4-475b-a6c0-9b4c458e03ea/24%3A7+Teach+Logo+-+Dark.png" alt="Logo" class="logo">
</div>
<div class="container mt-5">
    <h1 class="text-center mb-4">Nuevo Alumno</h1>
    <form action="#" th:action="@{/alumnos/guardar}" method="post">
        <div class="mb-3">
            <label for="rut" class="form-label">Rut:</label>
            <input type="text" id="rut" name="rut" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre:</label>
            <input type="text" id="nombre" name="nombre" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="direccion" class="form-label">Direccion:</label>
            <input type="text" id="direccion" name="direccion" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="materias" class="form-label">Materias:</label>
            <select multiple id="materias" name="materiaIds" class="form-select" required>
                <option th:each="materia : ${materias}" th:value="${materia.id}" th:text="${materia.nombre}"></option>
            </select>
        </div>

        <div>
            <input type="submit" value="Guardar" class="btn btn-primary">
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
