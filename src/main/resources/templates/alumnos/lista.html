<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="">
<head>
    <title>Alumnos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<style>
    .container {
        max-width: 800px;
    }
    .logo-container {
        background-color: blue;
        padding: 10px;
    }
    .logo {
        height: 50px;
    }
</style>
<body>
<div>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Universidad Andes</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="#" href="lista">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="nuevo-alumno">Agregar</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link disabled" aria-disabled="true">Disabled</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</div>
<div class="logo-container text-center">
    <img src="https://images.squarespace-cdn.com/content/v1/52feaa1ae4b09bbb5407864d/322ea8e0-b7e4-475b-a6c0-9b4c458e03ea/24%3A7+Teach+Logo+-+Dark.png" alt="Logo" class="logo">
</div>
<div class="container mt-5">
    <h1>Lista de Alumnos</h1>
    <p th:text="'Número de alumnos: ' + ${alumnos.size()}">Número de alumnos</p>
    <a class="btn btn-primary mb-2" href="/alumnos/nuevo-alumno">Agregar Nuevo Alumno</a>
    <table class="table table-striped table-hover align-middle" border="1">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Rut</th>
            <th>Nombre</th>
            <th>Direccion</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="alumno : ${alumnos}">
            <td th:text="${alumno.id}">ID</td>
            <td th:text="${alumno.rut}">Rut</td>
            <td th:text="${alumno.nombre}">Nombre</td>
            <td th:text="${alumno.direccion}">Direccion</td>
            <td>
                <a th:href="@{/alumnos/{id}(id=${alumno.id})}" class="btn btn-outline-primary">Ver Ramos</a>
                <form th:action="@{/alumnos/eliminar/{id}(id=${alumno.id})}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-danger " style="display: inline">X</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
